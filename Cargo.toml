# bin-features = ["ssr", "cargo_leptos"]
# lib-features = ["hydrate"]
# site-addr = "0.0.0.0:3000"
# assets-dir = "target/bundled"
# style-file = "style/main.scss"
# tailwind-input-file = "style/tailwind.css"

[patch."https://github.com/nv0skar/waveless"]
waveless = { path = "./frontend" }

waveless_commons = { path = "./commons" }
waveless_compiler = { path = "./compiler" }
waveless_runtime = { path = "./runtime" }

[profile.dev.package."*"]
debug = false
codegen-units = 256
opt-level = 1

[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
debug = false
strip = true
codegen-units = 256
lto = true
opt-level = 's'

[profile.dist]
inherits = "release"
